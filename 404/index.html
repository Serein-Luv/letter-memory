<canvas id="petals"></canvas>

<script>
var canvas=document.getElementById("petals");
var ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
var petals=[];
function Petal(){this.x=Math.random()*canvas.width;this.y=-20;this.size=Math.random()*15+8;this.speedY=Math.random()*1.5+0.5;this.speedX=Math.random()*1-0.5;this.rotation=Math.random()*360;this.rotationSpeed=Math.random()*2-1;this.opacity=Math.random()*0.5+0.5}
Petal.prototype.draw=function(){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rotation*Math.PI/180);ctx.fillStyle="rgba(255,182,193,"+this.opacity+")";ctx.beginPath();ctx.ellipse(0,0,this.size,this.size/2,0,0,Math.PI*2);ctx.fill();ctx.restore()};
Petal.prototype.update=function(){this.y+=this.speedY;this.x+=this.speedX+Math.sin(this.y*0.01)*0.5;this.rotation+=this.rotationSpeed;if(this.y>canvas.height+20)return false;return true};
for(var i=0;i<50;i++){petals.push(new Petal());petals[petals.length-1].y=Math.random()*canvas.height}
function animate(){ctx.clearRect(0,0,canvas.width,canvas.height);petals=petals.filter(function(p){return p.update()});petals.forEach(function(p){p.draw()});if(petals.length<50)petals.push(new Petal());requestAnimationFrame(animate)}
animate();
window.addEventListener("resize",function(){canvas.width=window.innerWidth;canvas.height=window.innerHeight})
</script>
